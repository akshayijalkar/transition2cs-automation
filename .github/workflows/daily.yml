name: Transition2CS daily Wan Short
on:
  schedule:
    - cron: '30 12 * * *' # 18:00 IST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: transition2cs-daily
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTOMATION_ENABLED: ${{ secrets.AUTOMATION_ENABLED }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ secrets.HF_SPACE }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: public
    steps:
      - name: Check prerequisites
        id: gate
        shell: bash
        run: |
          if [[ "$AUTOMATION_ENABLED" != "true" || -z "$HF_SPACE" || -z "$HF_TOKEN" || -z "$GOOGLE_CLIENT_ID" || -z "$GOOGLE_CLIENT_SECRET" || -z "$GOOGLE_REFRESH_TOKEN" ]]; then
            echo "Not activated: missing connection or explicit enable flag."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: '3.11'
          cache: pip
      - name: Install requirements
        if: steps.gate.outputs.ready == 'true'
        run: pip install -r requirements.txt
      - name: Generate and upload
        if: steps.gate.outputs.ready == 'true'
        run: python publish.py
