name: Transition2CS daily Drive queue
on:
  schedule:
    - cron: '30 12 * * *' # 18:00 Asia/Kolkata
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: transition2cs-daily
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UPLOAD_ENABLED: ${{ vars.UPLOAD_ENABLED }}
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
      DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
      YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API dependencies
        run: python -m pip install 'google-api-python-client>=2.150,<3' 'google-auth>=2.36,<3' 'requests>=2.32,<3'
      - name: Verify Drive queue and optionally upload
        run: python drive_publish.py
