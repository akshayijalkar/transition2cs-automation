
name: Verify Transition2CS YouTube

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip install google-auth requests

      - name: Verify channel without uploading
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          EXPECTED_CHANNEL: ${{ vars.YOUTUBE_CHANNEL_ID }}
        run: |
          python - <<'PY'
          import os
          import requests
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request

          assert os.getenv("EXPECTED_CHANNEL"), "Missing channel ID"

          creds = Credentials(
              None,
              refresh_token=os.environ["REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["CLIENT_ID"],
              client_secret=os.environ["CLIENT_SECRET"],
              scopes=[
                "https://www.googleapis.com/auth/youtube.readonly",
                "https://www.googleapis.com/auth/youtube.upload"
              ]
          )
          creds.refresh(Request())

          response = requests.get(
              "https://www.googleapis.com/youtube/v3/channels",
              params={"part":"snippet","mine":"true"},
              headers={"Authorization":f"Bearer {creds.token}"},
              timeout=30
          )
          if response.status_code != 200:
              try:
                  details = response.json().get("error", {})
                  reasons = [x.get("reason", "") for x in details.get("errors", [])]
                  print("YouTube API status:", response.status_code)
                  print("Google error:", details.get("status", "unknown"))
                  print("Google message:", details.get("message", "No details returned"))
                  print("Reason codes:", ", ".join(reasons) or "not provided")
              except ValueError:
                  print("YouTube API status:", response.status_code, "(non-JSON error)")
              raise SystemExit("Channel verification failed. No uploads attempted.")
          channels = response.json().get("items", [])

          assert channels, "No authorized YouTube channel found"
          channel = channels[0]

          print("Authorized channel name:", channel["snippet"]["title"])
          print("Authorized channel ID:", channel["id"])
          print("Expected channel ID:", os.environ["EXPECTED_CHANNEL"])
          if channel["id"] != os.environ["EXPECTED_CHANNEL"]:
              raise SystemExit("CHANNEL MISMATCH: OAuth selected another YouTube channel. No uploads attempted.")
          print("YouTube authorization: SUCCESS")
          print("Channel:", channel["snippet"]["title"])
          print("Channel ID:", channel["id"])
          print("No video was uploaded.")
          PY
