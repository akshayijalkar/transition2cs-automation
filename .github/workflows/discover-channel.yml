name: Discover authorized YouTube channel
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: python -m pip install google-auth requests
      - name: Read authorized YouTube channel (no uploads)
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          required = ['CLIENT_ID', 'CLIENT_SECRET', 'REFRESH_TOKEN']
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              raise SystemExit('Missing GitHub secrets: ' + ', '.join(missing))
          creds = Credentials(
              None,
              refresh_token=os.environ['REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['CLIENT_ID'],
              client_secret=os.environ['CLIENT_SECRET'],
              scopes=['https://www.googleapis.com/auth/youtube.readonly',
                      'https://www.googleapis.com/auth/youtube.upload']
          )
          creds.refresh(Request())
          response = requests.get(
              'https://www.googleapis.com/youtube/v3/channels',
              params={'part': 'id,snippet', 'mine': 'true'},
              headers={'Authorization': 'Bearer ' + creds.token},
              timeout=30
          )
          response.raise_for_status()
          items = response.json().get('items', [])
          if not items:
              raise SystemExit('No YouTube channel returned. Check which channel was selected during OAuth authorization.')
          for item in items:
              print('AUTHORIZED CHANNEL NAME:', item['snippet']['title'])
              print('AUTHORIZED CHANNEL ID:', item['id'])
          print('READ-ONLY VERIFICATION COMPLETE. No videos uploaded.')
          PY
